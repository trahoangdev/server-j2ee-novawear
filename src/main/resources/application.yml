spring:
  application:
    name: novawear
  datasource:
    url: jdbc:mysql://localhost:3306/novawear?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 190704
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

# JWT & CORS
app:
  jwt:
    secret: ${JWT_SECRET:NovawearJ2EESecretKeyForSigningTokenMustBeAtLeast256BitsLongForHS256}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    header: Authorization
    prefix: Bearer
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

server:
  port: 8080

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.example.novawear: DEBUG
    org.springframework.security: DEBUG
